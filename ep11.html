<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조팸스 원정대 EP.11 - 지구가 보내는 신호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="stage">
  <div class="masthead">
    <div class="kicker">JOPAMS EXPEDITION · MINI WEBCOMIC</div>
    <h1>조팸스 원정대 <span>EP.11</span></h1>
  </div>

  <div class="comic-frame" id="frame">
    <div class="panel active" data-panel="0">
      <div class="panel-inner">
        <div class="halftone-burst"></div>
        <div class="caption-tag">EPISODE 11</div>
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
          <div class="cover-title">
            <span class="ep">녹색제품 편</span>
            "지구가 보내는<br>신호"
          </div>
          <div class="trio-cover">
            <img src="assets/img/sunsik.png" alt="조순식" class="bounce">
            <img src="assets/img/daim.png" alt="조다임">
            <img src="assets/img/hoonmin.png" alt="조훈민" class="proud">
          </div>
          <div class="next-label">▶ 시작하려면 다음을 눌러주세요</div>
        </div>
      </div>
    </div>
    <div class="panel" data-panel="1">
        <div class="panel-inner">
        <div class="stagefloor"></div>
        <div class="caption-tag">다임, 방패로 미세먼지를 막으려는 헛수고</div>
        <img src="assets/img/daim.png" alt="조다임 (실드 스킬)" class="char-img focus shake" style="left:10%;">
        <div class="bubble left" id="ep11b1" style="left:4%; top:12%;">방패로 막으면<br>되겠지...?</div>
        </div></div>
    <div class="panel" data-panel="2">
        <div class="panel-inner">
        <div class="stagefloor"></div>
        <div class="caption-tag">훈민의 설명</div>
        <img src="assets/img/daim.png" alt="조다임 (실드 스킬)" class="char-img support" style="left:10%;">
        <img src="assets/img/hoonmin.png" alt="조훈민 (혜안 스킬)" class="char-img focus" style="left:52%;">
        <div class="bubble right" id="ep11b2" style="right:4%; top:10%;">그건 친환경 인증<br>제품이 진짜 방패야</div>
        </div></div>
    <div class="panel" data-panel="3">
        <div class="panel-inner">
        <div class="stagefloor"></div>
        <div class="caption-tag">다임, 감탄</div>
        <img src="assets/img/daim.png" alt="조다임 (실드 스킬)" class="char-img focus proud" style="left:10%;">
        <div class="bubble left" id="ep11b3" style="left:4%; top:12%;">이게 진짜<br>방패였다니!</div>
        </div></div>
    <div class="panel" data-panel="4">
      <div class="panel-inner">
        <div class="halftone-burst"></div>
        <div class="caption-tag">ITEM GET!</div>
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;">
          <div style="position:relative;">
            <span class="sparkle" style="top:-14px; left:-18px;">✨</span>
            <span class="sparkle" style="bottom:-10px; right:-20px; animation-delay:.4s;">✨</span>
            <div class="item-card">
              <div class="icon">🌱</div>
              <div class="tag">ITEM 11 / 12</div>
              <div class="name">녹색제품</div>
            </div>
          </div>
          
          <div class="next-label">다음 편에 계속 →</div>
        </div>
      </div>

  <div class="progress" id="progress"></div>

  <div class="controls">
    <button class="ghost" id="prevBtn">◀ 이전</button>
    <button id="playBtn">▶ 자동재생</button>
    <button id="nextBtn">다음 ▶</button>
  </div>

  <div class="nav-row">
    <a href="ep10.html">◀ EP.10</a>
    <span class="spacer">EP 11 / 12</span>
    <a href="ep12.html">EP.12 ▶</a>
  </div>

  <div class="foot-note">조팸스 원정대 · 공공구매 12대 우선구매 제도 학습 웹코믹</div>
</div>
